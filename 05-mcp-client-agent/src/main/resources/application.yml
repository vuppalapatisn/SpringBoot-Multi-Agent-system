server:
  port: 8085

spring:
  application:
    name: mcp-client-agent

  ai:
    # WHICH PROVIDER IS ACTIVE ------------------------------------------
    # Both starters are on the classpath, so this has to be set explicitly:
    # otherwise two ChatModel beans would be created and the ChatClient could
    # not be built. Values come from SpringAIModels: anthropic | google-genai.
    #
    # Only the selected provider's properties are bound, so only its key is
    # required - a Gemini-only setup never needs ANTHROPIC_API_KEY, and vice versa.
    model:
      chat: ${AI_CHAT_PROVIDER:anthropic}

    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      timeout: 30s
      max-retries: 2
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 1024
          temperature: 0.0


    # Google Gemini. Active when AI_CHAT_PROVIDER=google-genai.
    #
    # GoogleGenAiChatOptions implements ToolCallingChatOptions and
    # StructuredOutputChatOptions - the same pair as AnthropicChatOptions - so tool
    # calling and structured output (.entity()) work without any code change.
    #
    # api-key alone selects the Gemini Developer API (a key from aistudio.google.com).
    # For Vertex AI instead, set project-id, location and vertex-ai: true.
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # gemini-2.5-flash is the broadly available fast tier. gemini-2.5-pro for
            # planner or supervisor roles; newer 3.x names exist but availability varies
            # by account, so the default here is the safe one.
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.0
            # note the name: Gemini calls this max-output-tokens, not max-tokens
            max-output-tokens: 1024
    mcp:
      client:
        enabled: true
        name: refund-desk-agent
        version: 1.0.0
        type: SYNC
        request-timeout: 20s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            # One connection per server, named. The name is the unit of trust: the allowlist
            # below is keyed by the server's *advertised* name, and a tool from an unexpected
            # server is never offered to the model.
            refund-desk:
              url: http://localhost:8084
              endpoint: /mcp

    tools:
      throw-exception-on-error: false
      limits:
        max-total-tool-calls: 10
        max-calls-per-tool-default: 3
        max-calls-per-tool:
          refund-desk_issueRefund: 1
        on-limit-exceeded: RETURN_ERROR_RESPONSE

    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false

agentic:
  mcp-client:
    # Production: true. A tool whose definition no longer matches its pin is withheld.
    # Leave false only while pinning a new server for the first time.
    fail-closed-on-change: false

    # Two servers can both publish "issueRefund". Prefixing keeps them distinguishable in the
    # model's tool list, and makes per-tool limits above unambiguous.
    prefix-tool-names: true

    # THE ALLOWLIST. Anything not named here is never offered to the model.
    # expected-class is OUR classification, not the server's hint.
    # fingerprint: blank on first contact -> read the observed value from GET /api/mcp/tools,
    # review the definition, paste the hash here, then set fail-closed-on-change: true.
    allowed-tools:
      - server: refund-desk
        name: lookupOrder
        expected-class: R0
        fingerprint: ""
        reviewed-by: unreviewed
      - server: refund-desk
        name: checkFraudSignal
        expected-class: R1
        fingerprint: ""
        reviewed-by: unreviewed
      - server: refund-desk
        name: issueRefund
        expected-class: E2
        fingerprint: ""
        reviewed-by: unreviewed
      # Deliberately NOT allowlisted: getRefundStatus. The server publishes it; this client has
      # no use for it, so the model never sees it. Deny by default means the allowlist is the
      # decision, not the server's tool list.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    io.github.vuppalapatisn.agentic: INFO
