# Run any or all of the nine projects locally.
#
#   cp .env.example .env        # then put your key in it
#   docker compose build        # all nine images
#   docker compose up 06-workflow                   # just one
#   docker compose up 04-mcp-server 05-mcp-client   # the MCP pair, in dependency order
#
# Project NN listens on port 808N, so everything can run side by side.
#
# CHOOSING A MODEL PROVIDER
# -------------------------
# Put one of these in .env:
#
#   AI_CHAT_PROVIDER=anthropic       ANTHROPIC_API_KEY=sk-ant-...
#   AI_CHAT_PROVIDER=google-genai    GEMINI_API_KEY=AIza...
#
# Only the selected provider's key is needed. Nothing in src/main is provider-specific, so
# switching is configuration - see GeminiProviderTest in project 01, which boots the whole
# context on Gemini with no Anthropic key present at all.
#
# Everything reaches the containers through env_file rather than explicit `environment:` entries.
# That is deliberate: a variable absent from .env is absent from the container, so the app's
# placeholder stays unresolved and it fails fast with a clear message. Passing an empty string
# instead would let it start with a blank key and fail later at the first model call.

name: agentic-reference

x-common: &common
  restart: unless-stopped
  # A sane ceiling per container. It is a limit, not a reservation, and the images use
  # -XX:MaxRAMPercentage=75 so the JVM sizes its heap from it.
  mem_limit: 1g
  env_file:
    # required: false so `docker compose` still works before you have made a .env - useful for
    # project 04, which needs no key of any kind. Needs Compose v2.24+ (Docker Desktop 4.27+).
    - path: .env
      required: false
  environment: &common-env
    JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError

services:

  01-foundation:
    <<: *common
    image: agentic/chatclient-foundation:local
    build:
      context: ./01-chatclient-foundation
    ports: ["8081:8081"]

  02-guardrails:
    <<: *common
    image: agentic/tool-calling-guardrails:local
    build:
      context: ./02-tool-calling-guardrails
    ports: ["8082:8082"]
    environment:
      <<: *common-env
      # The kill switch: EXECUTE | DRY_RUN | DISABLED. A restart, not a rebuild.
      #
      # Note the name. Spring's relaxed binding replaces dots with underscores and *removes*
      # hyphens, so agentic.tools.execution-mode is AGENTIC_TOOLS_EXECUTIONMODE.
      # AGENTIC_TOOLS_EXECUTION_MODE would bind to agentic.tools.execution.mode, which does not
      # exist, and would be ignored silently - a kill switch that does nothing.
      AGENTIC_TOOLS_EXECUTIONMODE: ${AGENTIC_TOOLS_EXECUTIONMODE:-EXECUTE}

  03-rag:
    <<: *common
    image: agentic/rag-grounded-answers:local
    build:
      context: ./03-rag-grounded-answers
    ports: ["8083:8083"]

  04-mcp-server:
    <<: *common
    image: agentic/mcp-server-tools:local
    build:
      context: ./04-mcp-server-tools
    ports: ["8084:8084"]
    environment:
      <<: *common-env
      # This project has no model and needs no API key at all - which is exactly why it has to
      # enforce its own policy rather than trust a well-behaved caller.
      #
      # Its own kill switch. Reads keep working when it is off.
      AGENTIC_MCPSERVER_EXECUTIONENABLED: ${AGENTIC_MCPSERVER_EXECUTIONENABLED:-true}

  05-mcp-client:
    <<: *common
    image: agentic/mcp-client-agent:local
    build:
      context: ./05-mcp-client-agent
    ports: ["8085:8085"]
    depends_on:
      04-mcp-server:
        # The images carry a HEALTHCHECK, so this waits for a server that is actually up rather
        # than one whose process has merely started.
        condition: service_healthy
    environment:
      <<: *common-env
      # The MCP connection is a map entry whose key contains a hyphen, which environment-variable
      # relaxed binding cannot express. SPRING_APPLICATION_JSON is unambiguous. The host is the
      # compose service name, resolved by Docker's DNS - not localhost.
      SPRING_APPLICATION_JSON: >-
        {"spring":{"ai":{"mcp":{"client":{"streamable-http":{"connections":
        {"refund-desk":{"url":"http://04-mcp-server:8084","endpoint":"/mcp"}}}}}}}}

  06-workflow:
    <<: *common
    image: agentic/workflow-orchestration:local
    build:
      context: ./06-workflow-orchestration
    ports: ["8086:8086"]

  07-state-machine:
    <<: *common
    image: agentic/state-machine-orchestration:local
    build:
      context: ./07-state-machine-orchestration
    ports: ["8087:8087"]
    volumes:
      # Durability is the property this project exists to demonstrate. Without the volume,
      # `docker compose down` would lose a pending approval and quietly disprove the point.
      - state-machine-data:/app/data

  08-agent-loop:
    <<: *common
    image: agentic/autonomous-agent-loop:local
    build:
      context: ./08-autonomous-agent-loop
    ports: ["8088:8088"]

  09-multi-agent:
    <<: *common
    image: agentic/multi-agent-supervisor:local
    build:
      context: ./09-multi-agent-supervisor
    ports: ["8089:8089"]

volumes:
  state-machine-data:
