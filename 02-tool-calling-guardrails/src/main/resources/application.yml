server:
  # Project NN listens on 808N, so all nine can run side by side. See docker-compose.yml.
  port: 8082

spring:
  application:
    name: tool-calling-guardrails

  ai:
    # WHICH PROVIDER IS ACTIVE ------------------------------------------
    # Both starters are on the classpath, so this has to be set explicitly:
    # otherwise two ChatModel beans would be created and the ChatClient could
    # not be built. Values come from SpringAIModels: anthropic | google-genai.
    #
    # Only the selected provider's properties are bound, so only its key is
    # required - a Gemini-only setup never needs ANTHROPIC_API_KEY, and vice versa.
    model:
      chat: ${AI_CHAT_PROVIDER:anthropic}

    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      timeout: 30s
      max-retries: 2
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 1024
          temperature: 0.0


    # Google Gemini. Active when AI_CHAT_PROVIDER=google-genai.
    #
    # GoogleGenAiChatOptions implements ToolCallingChatOptions and
    # StructuredOutputChatOptions - the same pair as AnthropicChatOptions - so tool
    # calling and structured output (.entity()) work without any code change.
    #
    # api-key alone selects the Gemini Developer API (a key from aistudio.google.com).
    # For Vertex AI instead, set project-id, location and vertex-ai: true.
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # gemini-2.5-flash is the broadly available fast tier. gemini-2.5-pro for
            # planner or supervisor roles; newer 3.x names exist but availability varies
            # by account, so the default here is the safe one.
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.0
            # note the name: Gemini calls this max-output-tokens, not max-tokens
            max-output-tokens: 1024
    tools:
      # A tool error becomes a message the model can recover from, rather than an exception that
      # aborts the run. The guard has already refused the effect by this point.
      throw-exception-on-error: false
      observations:
        # Tool arguments and results can contain PII. Off in any environment with real data.
        include-content: false
      limits:
        # Framework-level ceilings on the model loop. These are the belt; GuardedToolExecutor and
        # the approval gate are the braces. Both layers, always.
        max-total-tool-calls: 10
        max-calls-per-tool-default: 3
        max-calls-per-tool:
          issueRefund: 1
          notifyCustomer: 1
          cancelRefund: 1
        on-limit-exceeded: RETURN_ERROR_RESPONSE
        excluded-tools:
          - lookupOrder

    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false

agentic:
  tools:
    # ---- THE KILL SWITCH -------------------------------------------------
    # EXECUTE | DRY_RUN | DISABLED. Changeable without a deploy; DRY_RUN performs no writes.
    execution-mode: EXECUTE

    # Every tool marked irreversible in code must appear here or the application will not start.
    approval-required-tools:
      - issueRefund
      - notifyCustomer

    # Tier 1: below this, and low risk, and inside the window -> no human is interrupted.
    auto-approve-below-minor: 10000      # $100.00
    # Tier 3: above this, or high risk -> two distinct approvers.
    dual-control-above-minor: 100000     # $1,000.00
    max-refund-age-days: 30

    # Expiry means NO. It never auto-approves.
    approval-ttl: PT24H

    max-irreversible-per-run: 2

    notification-allowlist:
      - "@customers.example"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    io.github.vuppalapatisn.agentic: INFO
